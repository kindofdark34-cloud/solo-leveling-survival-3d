name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & NDK
        run: |
          sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Build APK via Raylib Android Shell
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib-src
          git clone --depth 1 https://github.com/subtilis/raylib-android-template.git android-project || git clone --depth 1 https://github.com/swill/raylib-android-template.git android-project
          
          # Inject game source code
          mkdir -p android-project/app/src/main/cpp
          cp main.c android-project/app/src/main/cpp/main.c
          cp -r raylib-src/src/* android-project/app/src/main/cpp/
          
          cd android-project
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoloLeveling-Android-APK
          path: |
            android-project/app/build/outputs/apk/debug/*.apk
            android-project/**/build/outputs/apk/debug/*.apk
