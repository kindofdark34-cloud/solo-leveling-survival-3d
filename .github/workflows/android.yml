name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Platform Tools
        run: |
          sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Setup Raylib Android Template & Build
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib-game-template.git template
          cp main.c template/projects/Android/app/src/main/c/main.c || cp main.c template/src/main.c || true
          cd template/projects/Android || cd template
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "Building with native CMake..."
            cmake -B build -DPLATFORM=Android -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoloLeveling-Android
          path: template/**/build/outputs/apk/debug/*.apk
