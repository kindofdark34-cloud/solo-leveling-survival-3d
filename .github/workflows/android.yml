name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and Build Tools
        run: |
          sdkmanager --install "ndk;25.2.9519653" "build-tools;34.0.0" "platforms;android-34"

      - name: Prepare Raylib Android Project
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git
          mkdir -p raylib/projects/Android/app/src/main/c
          cp main.c raylib/projects/Android/app/src/main/c/main.c
          cd raylib/projects/Android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SoloLeveling-Android
          path: raylib/projects/Android/app/build/outputs/apk/debug/app-debug.apk
