name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          
      - name: Set up Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Clone Raylib & Build APK
        run: |
          git clone https://github.com/raysan5/raylib.git
          cp main.c raylib/projects/Android/app/src/main/c/main.c
          cd raylib/projects/Android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SoloLeveling-Android
          path: raylib/projects/Android/app/build/outputs/apk/debug/app-debug.apk
