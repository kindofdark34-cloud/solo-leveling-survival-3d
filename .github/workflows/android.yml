name: Build Web & Mobile HTML5

on: [push, workflow_dispatch]

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Emscripten (WebAssembly)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.50

      - name: Build Web Game
        run: |
          git clone --depth 1 https://github.com/raysan5/raylib.git raylib-src
          cd raylib-src/src
          make PLATFORM=PLATFORM_WEB -B
          cd ../..

          # Compile main.c to Web HTML5
          emcc -o index.html main.c raylib-src/src/libraylib.a \
            -Os -Wall -std=c99 \
            -I raylib-src/src \
            -DPLATFORM_WEB \
            -s USE_GLFW=3 \
            -s ASYNCIFY \
            -s TOTAL_MEMORY=67108864 \
            -s FORCE_FILESYSTEM=1 \
            --shell-file raylib-src/src/minshell.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
